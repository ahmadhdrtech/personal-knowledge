<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neuron knowledge map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0F3;--surface:#F8FAFB;--ink:#1B2236;--muted:#5C6578;--line:#CDD3DC;--edge:#8A93A6;
  --unseen:#BAC1CC;--shaky:#D99A1E;--solid:#2C8A66;--accent:#3A5BD9;--accent-soft:#E4E9FB;--danger:#B3412F;--danger-soft:#F6E3DF;
  --c0:#7B52CC;--c1:#2C6FD1;--c2:#C0467A;--c3:#178C99;--c4:#B86E14;--c5:#4E8A2B;--c6:#8E5A3C;--c7:#5560A8;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#11151E;--surface:#191F2D;--ink:#E6E9EF;--muted:#9AA3B5;--line:#2C3446;--edge:#69748B;
    --unseen:#4A5366;--shaky:#E5AA35;--solid:#3DB487;--accent:#8198F3;--accent-soft:#232C4A;--danger:#E07A66;--danger-soft:#3A2420;
    --c0:#A58AF0;--c1:#6A9EF0;--c2:#E07AA6;--c3:#4CC0CC;--c4:#E0A050;--c5:#86C060;--c6:#C99278;--c7:#8F98E0;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11151E;--surface:#191F2D;--ink:#E6E9EF;--muted:#9AA3B5;--line:#2C3446;--edge:#69748B;
  --unseen:#4A5366;--shaky:#E5AA35;--solid:#3DB487;--accent:#8198F3;--accent-soft:#232C4A;--danger:#E07A66;--danger-soft:#3A2420;
  --c0:#A58AF0;--c1:#6A9EF0;--c2:#E07AA6;--c3:#4CC0CC;--c4:#E0A050;--c5:#86C060;--c6:#C99278;--c7:#8F98E0;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;display:flex;flex-direction:column}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--paper);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:19px;letter-spacing:-.01em;margin-right:6px}
.brand svg{width:26px;height:26px}
.search{flex:1;min-width:150px;max-width:320px}
.field{width:100%;padding:8px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.field::placeholder{color:var(--muted)}
textarea.field{resize:vertical;line-height:1.5}
.actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-size:14px;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--edge)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#11151E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#11151E}}
.btn:disabled{opacity:.5;cursor:default}
.btn.small{padding:4px 9px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);flex:none}
.seg button{border:0;background:none;padding:6px 10px;font-size:13px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.sel-wrap{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.sel-wrap select{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
main{flex:1;display:grid;grid-template-columns:1fr 410px;min-height:0}
#graph{position:relative;min-height:0;overflow:hidden}
#canvas{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#canvas:active{cursor:grabbing}
.top{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.top>*{pointer-events:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:4px 10px;border-radius:999px;font-size:13px}
.chip[aria-pressed="false"]{opacity:.45}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.legend{position:absolute;left:10px;bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:12px;color:var(--muted);display:grid;grid-template-columns:auto auto;gap:4px 14px}
.legend .row{display:flex;align-items:center;gap:7px}
.legend svg{width:28px;height:12px;flex:none}
.toast{position:absolute;top:52px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:92%}
.toast.show{opacity:1}
aside{border-left:1px solid var(--line);background:var(--surface);overflow-y:auto;padding:20px 22px 48px}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:500;text-align:left}
.link:hover{text-decoration:underline}
.back{font-size:13px;margin-bottom:12px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-right:10px}
h2{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:29px;line-height:1.15;margin:6px 0 12px;letter-spacing:-.01em}
h2 .alt{font-size:19px;margin-top:4px}
h3{font-size:13px;font-weight:600;color:var(--muted);margin:22px 0 8px}
.alt{display:block;color:var(--muted);font-size:.9em;font-weight:400}
.summary{font-family:"Newsreader",Georgia,serif;font-size:18px;line-height:1.55;margin:0}
.summary .alt{font-size:16px;margin-top:8px;font-style:italic}
.meter{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.meter .track{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter .fill{height:100%;border-radius:3px;transition:width .4s ease}
.tabs{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--line);margin:16px 0 4px}
.tab{background:none;border:0;padding:8px 9px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}
ul.plain{list-style:none;padding:0;margin:0}
.row-item{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.row-item:last-child{border-bottom:0}
.pill{font-size:11px;padding:1px 7px;border-radius:999px;margin-left:6px;white-space:nowrap;color:var(--accent);background:var(--accent-soft)}
.pill.bad{color:var(--danger);background:var(--danger-soft)}
.src b{font-weight:500;display:block;font-size:14px}
.src span{font-size:13px;color:var(--muted)}
.card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--paper);margin-bottom:10px}
.card.dashed{border-style:dashed;border-color:var(--accent)}
.card.warn{border-color:var(--danger)}
.card p{margin:0 0 6px}
.muted{color:var(--muted);font-size:14px}
.small{font-size:13px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.prompt{font-family:"Newsreader",Georgia,serif;font-size:19px;line-height:1.4;margin:0 0 14px}
.kind{font-size:12px;color:var(--muted);margin-bottom:6px}
.kind.bridge{color:var(--accent)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.opt:hover:not(:disabled){border-color:var(--edge)}
.opt.picked{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.opt.right{border-color:var(--solid);box-shadow:inset 3px 0 0 var(--solid)}
.opt.wrong{border-color:var(--danger);box-shadow:inset 3px 0 0 var(--danger)}
.opt:disabled{cursor:default}
.conf{margin-top:6px}
.conf p{margin:0 0 8px;font-size:14px;font-weight:500}
.conf .btnrow{margin-top:0}
.verdict{margin-top:12px;font-size:14px}
.verdict strong{font-weight:600}
.err{color:var(--danger);font-size:13px;margin-top:6px}
.path{list-style:none;padding:0;margin:0;counter-reset:step}
.path li{position:relative;padding:0 0 16px 30px}
.path li::before{counter-increment:step;content:counter(step);position:absolute;left:0;top:1px;width:20px;height:20px;border-radius:50%;border:1px solid var(--edge);font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--muted);background:var(--surface)}
.path li::after{content:"";position:absolute;left:10px;top:23px;bottom:2px;width:1px;background:var(--line)}
.path li:last-child::after{display:none}
.path li.here::before{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.path .sub{display:block;font-size:12px;color:var(--muted)}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:8px 0 6px;background:var(--line)}
.keys{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.split{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.vocab{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.vocab:last-child{border-bottom:0}
.vocab b{font-weight:500}
.vocab .ex{grid-column:1/-1;font-size:13px;color:var(--muted);font-style:italic}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.bubble{padding:10px 12px;border-radius:12px;font-size:14px;line-height:1.55;max-width:92%;white-space:pre-wrap}
.bubble.me{align-self:flex-end;background:var(--accent-soft)}
.bubble.ai{align-self:flex-start;background:var(--paper);border:1px solid var(--line)}
.status{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-top:8px}
.score{font-family:"Newsreader",Georgia,serif;font-size:34px;line-height:1}
details summary{cursor:pointer;font-size:14px;font-weight:500;margin-top:8px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:20px;width:min(640px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(10,14,24,.45)}
dialog h2{margin-top:0}
label.lab{display:block;font-size:13px;font-weight:500;margin:12px 0 5px}
.hidden{display:none!important}
/* graph */
.hull path{fill-opacity:.09;stroke-opacity:.5;stroke-width:1.2;transition:opacity .4s}
.hull text{font-size:13px;font-weight:600;text-anchor:middle;paint-order:stroke;stroke:var(--paper);stroke-width:4px}
.hulls.off{opacity:0}
.hulls{transition:opacity .4s}
.edge{fill:none;stroke:var(--edge);stroke-width:1.3;transition:opacity .2s}
.edge.t-related{stroke-opacity:.55}
.edge.t-contrasts{stroke-dasharray:6 4}
.edge.t-example_of{stroke-dasharray:1 4;stroke-linecap:round;stroke-width:1.8}
.edge.suggested{stroke:var(--accent);stroke-dasharray:4 4;stroke-width:1.6;stroke-opacity:1}
.edge.hot{stroke:var(--ink);stroke-opacity:1}
.domains .edge{stroke-opacity:.35}
.node{cursor:pointer;transition:opacity .2s}
.node .core{stroke:var(--surface);stroke-width:1.5}
.node .flag{fill:var(--danger);stroke:var(--surface);stroke-width:1.5}
.node text{font-size:12px;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round;text-anchor:middle;pointer-events:none}
.node text .sub{fill:var(--muted);font-size:11px}
.node.sel text{font-weight:600}
.node.sel .core{stroke:var(--ink);stroke-width:2.5}
.node.match .core{stroke:var(--accent);stroke-width:3}
.node:focus{outline:none}
.node:focus-visible .core{stroke:var(--accent);stroke-width:3}
.dim{opacity:.15}
.arrowhead{fill:var(--edge)}
.arrowhead.hot{fill:var(--ink)}
.arrowhead.acc{fill:var(--accent)}
@media (prefers-reduced-motion:no-preference){
  .edge.suggested{animation:flow 1.2s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-16}}
}
@media (max-width:860px){
  html,body{height:auto}
  body{display:block}
  main{display:block}
  #graph{height:62vh}
  aside{border-left:0;border-top:1px solid var(--line)}
  .legend .lt{display:none}
  .legend{grid-template-columns:auto}
}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">
    <svg viewBox="0 0 26 26" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M13 13L4 5M13 13l9-6M13 13l-2 10M13 13l10 6"/></g><circle cx="13" cy="13" r="4" fill="currentColor"/><circle cx="4" cy="5" r="2" fill="currentColor"/><circle cx="22" cy="7" r="2" fill="currentColor"/><circle cx="11" cy="23" r="2" fill="currentColor"/><circle cx="23" cy="19" r="2" fill="currentColor"/></svg>
    Neuron
  </div>
  <div class="search"><input id="q" class="field" type="search" placeholder="Search concepts" aria-label="Search concepts" autocomplete="off"></div>
  <div class="seg" id="langSeg" role="group" aria-label="Language">
    <button data-lang="en">EN</button><button data-lang="id">ID</button><button data-lang="both">EN + ID</button>
  </div>
  <div class="actions">
    <label class="sel-wrap">AI depth
      <select id="depth"><option value="quick">Quick</option><option value="default">Balanced</option><option value="complex">Deep reasoning</option></select>
    </label>
    <button class="btn" id="reviewBtn">Review</button>
    <button class="btn primary" id="addBtn">Add source</button>
  </div>
</header>
<main>
  <section id="graph" aria-label="Concept map">
    <svg id="canvas" role="img" aria-label="Network of concepts, grouped into domains"></svg>
    <div class="top">
      <div class="chips" id="chips"></div>
      <div class="seg" id="viewSeg" role="group" aria-label="View">
        <button data-view="network">Network</button><button data-view="domains">Domains</button>
      </div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </section>
  <aside id="panel"></aside>
</main>

<dialog id="addDlg" aria-labelledby="addTitle">
  <h2 id="addTitle">Add a source</h2>
  <p class="muted">Paste an article, your notes or a transcript. Claude picks out the key concepts, matches them to concepts you already have, assigns domains, adds English and Indonesian terms, and suggests links for you to approve.</p>
  <label class="lab" for="srcTitle">Title</label>
  <input id="srcTitle" class="field" placeholder="e.g. Chapter 3, Consumer Behavior">
  <label class="lab" for="srcText">Text</label>
  <textarea id="srcText" class="field" rows="9" placeholder="Paste the text here"></textarea>
  <div class="err hidden" id="srcErr"></div>
  <div class="status hidden" id="srcStatus"><span id="srcStatusText">Thinking…</span><button class="btn small" id="srcStop">Stop</button></div>
  <div class="btnrow">
    <button class="btn primary" id="srcGo">Find concepts</button>
    <button class="btn" id="srcSample">Use the sample article</button>
    <button class="btn" id="srcOffline">Add offline demo</button>
    <button class="btn" id="srcCancel">Cancel</button>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
/* ================= seed data ================= */
const B=(en,id)=>({en,id});
const O=arr=>arr.map(([en,id])=>({en,id}));
const Q=(q,o,a,why,bridge)=>({q,o:O(o),a,why,bridge:bridge||null});
const FERRY={t:"Ferry Irwandi, How To Be A Good Storyteller",n:"Your notes from the video."};
const TOPICS0=[
  {key:"story",en:"Storytelling",id:"Teknik bercerita",c:0},
  {key:"ads",en:"Paid ads",id:"Iklan berbayar",c:1},
  {key:"psych",en:"Consumer psychology",id:"Psikologi konsumen",c:2},
  {key:"learn",en:"Learning science",id:"Ilmu belajar",c:3}
];
const NODES0=[
 {id:"hook",label:B("Hook","Hook (kait pembuka)"),topics:["story","ads"],mastery:70,
  summary:B("The first one to three seconds of a video. It stops the scroll by opening a question, tension or surprise the viewer wants resolved.","Satu sampai tiga detik pertama video. Hook menghentikan scroll dengan membuka pertanyaan, ketegangan, atau kejutan yang ingin dituntaskan penonton."),
  sources:[{t:FERRY.t,n:"Hook comes from the conflict, not from shouting."},{t:"Meta Business Help Center, creative best practices",n:"Capture attention in the first seconds of video ads."}],
  vocab:[{en:"scroll-stopping",id:"bikin berhenti scroll",ex:"Visual pembuka harus bikin berhenti scroll."},{en:"open loop",id:"rasa penasaran yang belum terjawab",ex:"Hook yang baik membuka rasa penasaran di detik pertama."}],
  quiz:[Q(B("What makes a hook work, according to your notes?","Menurut catatanmu, apa yang membuat hook berhasil?"),
   [["Loud music in the first second","Musik keras di detik pertama"],["Opening a question or tension the viewer wants resolved","Membuka pertanyaan atau ketegangan yang ingin dituntaskan penonton"],["Showing the logo early","Menampilkan logo sejak awal"],["Listing product specs","Menyebutkan spesifikasi produk"]],1,
   B("A hook earns the next seconds by opening a loop. Volume or branding alone gives no reason to stay.","Hook mendapatkan detik berikutnya dengan membuka rasa penasaran. Suara keras atau logo saja tidak memberi alasan untuk bertahan."))]},
 {id:"three_act",label:B("Three-part structure","Struktur tiga babak"),topics:["story"],mastery:55,
  summary:B("Setup, conflict, resolution. Even a 30-second video is easy to follow when it introduces a situation, raises a problem and resolves it.","Pengenalan, konflik, penyelesaian. Video 30 detik pun mudah diikuti jika mengenalkan situasi, memunculkan masalah, lalu menyelesaikannya."),
  sources:[FERRY,{t:"Syd Field, Screenplay (1979)",n:"The classic three-act model for film."}],
  vocab:[{en:"setup",id:"babak pengenalan",ex:"Di babak pengenalan, tunjukkan lokasi proyeknya."},{en:"resolution",id:"babak penyelesaian (resolusi)",ex:"Produk muncul di babak penyelesaian."}],
  quiz:[Q(B("In a 30-second product video, where does the product usually enter?","Di video produk 30 detik, kapan produk biasanya muncul?"),
   [["In the setup, before any problem","Di babak pengenalan, sebelum ada masalah"],["At the resolution, as the answer to the conflict","Di babak penyelesaian, sebagai jawaban atas konflik"],["Only in the caption","Hanya di caption"],["It shouldn’t appear","Tidak perlu muncul"]],1,
   B("The product persuades best as the answer to a problem the viewer already cares about.","Produk paling meyakinkan saat hadir sebagai jawaban atas masalah yang sudah dipedulikan penonton."))]},
 {id:"conflict",label:B("Conflict","Konflik"),topics:["story"],mastery:40,
  summary:B("The problem or stakes that make the viewer care. Without conflict a video is information; with it, it becomes a story.","Masalah atau taruhan yang membuat penonton peduli. Tanpa konflik, video hanya informasi; dengan konflik, video menjadi cerita."),
  sources:[FERRY],
  vocab:[{en:"stakes",id:"taruhan (apa yang dipertaruhkan)",ex:"Taruhannya: proyek telat dan kena denda."},{en:"pain point",id:"titik masalah",ex:"Titik masalah pemilik bengkel: kompresor mati saat order menumpuk."}],
  quiz:[Q(B("Which line creates the strongest conflict for a workshop owner?","Kalimat mana yang menciptakan konflik paling kuat bagi pemilik bengkel?"),
   [["Our compressor is 2 HP","Kompresor kami 2 HP"],["The order is due at eight, and the compressor just died","Order harus selesai jam delapan, dan kompresornya baru saja mati"],["We have many colors","Tersedia banyak warna"],["Free shipping this week","Gratis ongkir minggu ini"]],1,
   B("Conflict needs stakes and a moment. A deadline plus a breakdown gives both.","Konflik butuh taruhan dan momen. Tenggat waktu ditambah mesin mati memberi keduanya.")),
   Q(B("Why do stakes framed as something the viewer could lose often hit harder?","Mengapa taruhan yang dibingkai sebagai sesuatu yang bisa hilang sering lebih kena?"),
   [["Losses feel larger than equal gains","Kerugian terasa lebih besar daripada keuntungan yang setara"],["People prefer bad news","Orang lebih suka kabar buruk"],["Negative words are cheaper to film","Kata negatif lebih murah diproduksi"],["Platforms favor negative content","Platform mengutamakan konten negatif"]],0,
   B("Loss aversion: a possible loss weighs more than a gain of the same size.","Loss aversion: potensi kerugian terasa lebih berat daripada keuntungan yang sama besarnya."),"lossaversion")]},
 {id:"rhetoric",label:B("Ethos, pathos, logos","Ethos, pathos, logos"),topics:["story"],mastery:60,
  summary:B("Aristotle’s three ways to persuade: the speaker’s credibility, the audience’s emotion and the argument’s logic.","Tiga cara membujuk menurut Aristoteles: kredibilitas pembicara, emosi audiens, dan logika argumen."),
  sources:[{t:"Aristotle, Rhetoric",n:"The original three modes of persuasion."},FERRY],

const SAMPLE_TEXT="Most ad accounts don’t fail because of targeting; they fail because the creative wears out. When a small audience sees the same video again and again, frequency climbs and click-through rate falls. This is creative fatigue. A frequency cap limits how many times one person sees an ad in a set period, which slows fatigue but also limits reach. The stronger fix is novelty: new hooks, new scenes and new faces recapture attention, because the brain notices what is new and filters out what it has already seen. Teams that refresh creative on a schedule, rather than waiting for results to crash, keep cost per result stable. Some marketers borrow from learning science here: just as spaced reviews keep a memory alive without overloading it, spaced exposures keep a brand familiar without exhausting the audience.";

function normalize(s){

  return s;
}

let REF=null,SYNC="device",cloudTimer=null,writing=false,pendingJson=null;
function scheduleCloud(json){
  if(!REF)return;
  pendingJson=json||JSON.stringify(snapshot());
  clearTimeout(cloudTimer);cloudTimer=setTimeout(flushCloud,1200);
}
async function flushCloud(){
  if(!REF||writing||!pendingJson)return;
  const json=pendingJson;pendingJson=null;
  if(json.length>240000){SYNC="toolarge";return}
  writing=true;
  try{await REF.set({json,updated:S.updated});SYNC="account"}catch(e){SYNC="error"}

function edgePath(l){
  const s=l.source,t=l.target;if(s.x==null||t.x==null)return "";
  const dx=t.x-s.x,dy=t.y-s.y;
  const cx=(s.x+t.x)/2-dy*.12,cy=(s.y+t.y)/2+dx*.12;
  const v1x=cx-s.x,v1y=cy-s.y,d1=Math.hypot(v1x,v1y)||1,v2x=t.x-cx,v2y=t.y-cy,d2=Math.hypot(v2x,v2y)||1;
  const r1=radius(s)+6,r2=radius(t)+(TYPES[l.type].dir?7:6);
  return `M${s.x+v1x/d1*r1},${s.y+v1y/d1*r1} Q${cx},${cy} ${t.x-v2x/d2*r2},${t.y-v2y/d2*r2}`;
}
function drawHulls(){
  if(S.prefs.view!=="domains"||!hullSel)return;
  hullSel.each(function(tp){
    const pts=[];
    S.nodes.forEach(n=>{if(n.x==null||!visible(n)||hidden.has(tp.key)||!n.topics.includes(tp.key))return;const r=radius(n)+26;for(let i=0;i<10;i++){const a=i/10*2*Math.PI;pts.push([n.x+Math.cos(a)*r,n.y+Math.sin(a)*r])}});
    const g=d3.select(this);
    if(pts.length<3){g.select("path").attr("d",null);g.select("text").text("");return}
    const h=d3.polygonHull(pts);const top=h.reduce((m,p)=>p[1]<m[1]?p:m,h[0]);
    g.select("path").attr("d",hullLine(h));
    g.select("text").attr("x",top[0]).attr("y",top[1]-7).text(T(tp));
  });
}
function tick(){linkSel.attr("d",edgePath);nodeSel.attr("transform",d=>`translate(${d.x},${d.y})`);drawHulls()}

/* ----- test ----- */
function renderTest(n,body){
  body.innerHTML=`<div class="btnrow" style="margin:12px 0 14px"><div class="seg" role="group" aria-label="Test type"><button data-mode="mcq" aria-pressed="${testMode==="mcq"}">Multiple choice</button><button data-mode="essay" aria-pressed="${testMode==="essay"}">Essay</button></div></div><div id="testBody"></div>`;

  const tb=body.querySelector("#testBody");
  testMode==="mcq"?renderMCQ(n,tb):renderEssay(n,tb);
}
const CBM={right:{guess:6,fair:14,sure:20},wrong:{guess:0,fair:-8,sure:-18}};
const VERDICT={
  "right-sure":["Solid.","You knew it, and you knew that you knew it."],
  "right-fair":["Correct.","Your confidence is catching up with your knowledge."],
  "right-guess":["Lucky guess.","Right answer, low confidence. It stays in your review queue until you answer it with confidence."],
  "wrong-guess":["Honest gap.","You knew you didn’t know. That’s the easiest kind of gap to fix."],
  "wrong-fair":["Shaky.","Read the explanation, then try again later."],
  "wrong-sure":["Misconception flagged.","You were certain and wrong, so this concept moves to the top of your review."]
};
function confButtons(){return CONF.map(c=>`<button class="btn small" data-conf="${c.k}">${esc(T(c))}</button>`).join("")}
function record(n,right,conf,delta,kind){
  n.hist.push({c:right?1:0,k:conf,t:Date.now(),kind});if(n.hist.length>40)n.hist.shift();
  n.mastery=Math.max(0,Math.min(100,Math.round(n.mastery+delta)));
  if(!right&&conf==="sure")n.miscon=true;
  if(right&&conf==="sure")n.miscon=false;
  save();render();refreshMeter(n);
}
function renderMCQ(n,tb){
  if(!n.quiz.length){
    tb.innerHTML=`<p class="muted">No questions for this concept yet.</p><div id="genBox" class="btnrow"></div>`;
    genButton(n,tb.querySelector("#genBox"));return;
  }
  const i=(quizIdx[n.id]||0)%n.quiz.length,q=n.quiz[i];
  const kind=q.bridge&&byId(q.bridge)?`<div class="kind bridge">Bridge question linking to ${esc(T(byId(q.bridge).label))}</div>`:`<div class="kind">Question ${i+1} of ${n.quiz.length}${q.ai?", written by AI":""}</div>`;
  tb.innerHTML=`<div class="card">${kind}<p class="prompt">${L(q.q)}</p>
    ${q.o.map((o,j)=>`<button class="opt" data-opt="${j}">${L(o)}</button>`).join("")}
    <div class="conf"><p>How sure are you?</p><div class="btnrow">${confButtons()}</div><div class="err hidden" id="cErr"></div></div>
    <div id="fb"></div></div><div id="genBox" class="btnrow"></div>`;
  const opts=tb.querySelectorAll("[data-opt]"),err=tb.querySelector("#cErr");
  opts.forEach(b=>b.onclick=()=>{MCQ.sel=+b.dataset.opt;opts.forEach(o=>o.classList.toggle("picked",o===b));err.classList.add("hidden")});
  tb.querySelectorAll("[data-conf]").forEach(cb=>cb.onclick=()=>{
    if(MCQ.sel==null){err.textContent="Pick an answer first.";err.classList.remove("hidden");return}
    const conf=cb.dataset.conf,right=MCQ.sel===q.a;
    opts.forEach(o=>{o.disabled=true;o.classList.remove("picked");if(+o.dataset.opt===q.a)o.classList.add("right")});
    if(!right)opts[MCQ.sel].classList.add("wrong");
    tb.querySelector(".conf").classList.add("hidden");
    let delta=CBM[right?"right":"wrong"][conf];
    if(right&&q.bridge&&conf!=="guess")delta+=5;
    record(n,right,conf,delta,"mcq");
    if(right&&q.bridge&&byId(q.bridge)&&conf!=="guess"){const o=byId(q.bridge);o.mastery=Math.min(100,o.mastery+5);save();render()}
    const [h,t]=VERDICT[(right?"right":"wrong")+"-"+conf];
    tb.querySelector("#fb").innerHTML=`<div class="verdict"><p><strong>${h}</strong> ${t}</p><p>${L(q.why)}</p><p class="muted small">Mastery ${delta>=0?"+":"−"}${Math.abs(delta)}%, now ${n.mastery}%.</p>
      <div class="btnrow"><button class="btn small" id="nextQ">${n.quiz.length>1?"Next question":"Try again"}</button></div></div>`;
    tb.querySelector("#nextQ").onclick=()=>{quizIdx[n.id]=(quizIdx[n.id]||0)+1;MCQ={sel:null};renderPanel()};
  });
  genButton(n,tb.querySelector("#genBox"));
}
function genButton(n,box){

  const go=async bridge=>{

    try{
      const r=await AI.json(`${RULES}\n\n${conceptContext(n)}\n${b?`\nBRIDGE CONCEPT: ${b.label.en}: ${b.summary.en}${b.userDef?` (learner’s definition: ${b.userDef})`:""}\n`:""}\nAVOID REPEATING: ${n.quiz.map(x=>x.q.en).join(" | ")}\n\nWrite one multiple-choice question that tests understanding, not memorized wording${b?`, and that requires connecting “${n.label.en}” with “${b.label.en}”`:""}. Prefer a realistic scenario. Exactly 4 options, one correct, plausible distractors. Give English and natural Indonesian versions of everything.\nReply with only JSON: {"q_en":"","q_id":"","options":[{"en":"","id":""},{"en":"","id":""},{"en":"","id":""},{"en":"","id":""}],"answer":0,"why_en":"","why_id":""}`,{modelTier:tier(),signal:ctl.signal});
      if(!r||!Array.isArray(r.options)||r.options.length!==4||!(r.answer>=0&&r.answer<4))throw {code:"invalid_json"};
      n.quiz.push({q:B(String(r.q_en),String(r.q_id||r.q_en)),o:r.options.map(o=>B(String(o.en),String(o.id||o.en))),a:+r.answer,why:B(String(r.why_en||""),String(r.why_id||r.why_en||"")),bridge:b?b.id:null,ai:true});

function renderEssay(n,tb){
  if(!AI){tb.innerHTML=`<div class="card"><p><strong>Essay tests need Claude.</strong></p><p class="muted">Open this page inside Claude and allow it to use Claude when asked. Claude writes an open question, then grades your answer against your sources and definitions, with deep reasoning if you choose it in AI depth.</p></div>`;return}
  const E=ESSAY[n.id]||(ESSAY[n.id]={});
  if(!E.q){
    tb.innerHTML=`<p class="muted">Claude writes an open question about this concept. You answer in your own words, in English or Indonesian, and say how sure you are. Claude grades the understanding, not the wording.</p><div id="eBox" class="btnrow"><button class="btn primary small" id="eGen">Write me an essay question</button></div>`;
    tb.querySelector("#eGen").onclick=async()=>{
      const box=tb.querySelector("#eBox"),ctl=busy(box,"Writing a question…");
      try{
        const r=await AI.json(`${RULES}\n\n${conceptContext(n)}\n\nWrite one open essay question that checks whether the learner truly understands this concept: ask them to explain why or how, or to apply it to a realistic situation, not just to define it. Also write a short grading rubric of 3 to 5 key points a good answer must contain, based only on the information above.\nReply with only JSON: {"q_en":"","q_id":"","rubric":[""]}`,{modelTier:tier()==="quick"?"quick":"default",signal:ctl.signal});
        if(!r||!r.q_en)throw {code:"invalid_json"};
        E.q=B(String(r.q_en),String(r.q_id||r.q_en));E.rubric=(r.rubric||[]).map(String);E.answer="";E.res=null;renderPanel();
      }catch(e){box.innerHTML=`<p class="err">${esc(errMsg(e))}</p>`}
    };
    return;
  }
  if(E.res){renderEssayResult(n,tb,E);return}
  tb.innerHTML=`<div class="card"><div class="kind">Essay question</div><p class="prompt">${L(E.q)}</p>
    <textarea class="field" rows="7" id="eAns" placeholder="Write your answer in English or Indonesian" aria-label="Your answer">${esc(E.answer||"")}</textarea>
    <div class="conf"><p style="margin-top:12px">How sure are you? Pick one to submit.</p><div class="btnrow">${confButtons()}</div></div>
    <div class="err hidden" id="eErr"></div><div id="eStat"></div></div>
    <div class="btnrow"><button class="link small" id="eNew">Ask a different question</button></div>`;
  const ta=tb.querySelector("#eAns"),err=tb.querySelector("#eErr");
  ta.oninput=()=>{E.answer=ta.value;err.classList.add("hidden")};
  tb.querySelector("#eNew").onclick=()=>{ESSAY[n.id]={};renderPanel()};
  tb.querySelectorAll("[data-conf]").forEach(cb=>cb.onclick=async()=>{
    const ans=ta.value.trim();
    if(ans.split(/\s+/).length<8){err.textContent="Write at least a couple of sentences before submitting.";err.classList.remove("hidden");return}
    const conf=cb.dataset.conf;E.answer=ans;E.conf=conf;
    tb.querySelectorAll("[data-conf]").forEach(x=>x.disabled=true);ta.disabled=true;
    const ctl=busy(tb.querySelector("#eStat"),S.prefs.depth==="complex"?"Grading with deep reasoning. This can take a minute…":"Grading…");
    try{
      const listLang=S.prefs.lang==="id"?"Indonesian":"English";
      const r=await AI.json(`${RULES}\n\n${conceptContext(n)}\n\nESSAY QUESTION: ${E.q.en}\nRUBRIC:\n${E.rubric.map(x=>"- "+x).join("\n")}\nLEARNER’S ANSWER (may be in English or Indonesian):\n"""${ans}"""\nLEARNER’S SELF-RATED CONFIDENCE: ${CONF.find(c=>c.k===conf).en}\n\nGrade the answer fairly. Reward correct understanding in the learner’s own words; do not reward length or fancy wording. Check each rubric point. Name any misconceptions explicitly. If the answer relies on a term you don’t know and that isn’t in the glossary, list it in unknown_terms instead of marking it wrong. Write got, missing and misconceptions in ${listLang}.\nReply with only JSON: {"score":0,"verdict":"understood|partial|not_yet","got":[""],"missing":[""],"misconceptions":[""],"feedback_en":"","feedback_id":"","model_answer_en":"","model_answer_id":"","unknown_terms":[""]}`,{modelTier:tier(),signal:ctl.signal});
      if(!r||typeof r.score!=="number")throw {code:"invalid_json"};
      r.score=Math.max(0,Math.min(100,Math.round(r.score)));
      ["got","missing","misconceptions","unknown_terms"].forEach(k=>r[k]=(Array.isArray(r[k])?r[k]:[]).map(String).filter(Boolean));
      const raw=(r.score-50)/50*20,mult=raw>=0?{guess:.5,fair:.85,sure:1.1}[conf]:{guess:.3,fair:.8,sure:1.3}[conf];
      const delta=Math.round(raw*mult),right=r.score>=70;
      record(n,right,conf,delta,"essay");
      if(r.misconceptions.length&&conf==="sure"){n.miscon=true;save();render()}
      E.res=r;E.delta=delta;renderPanel();
    }catch(e){tb.querySelector("#eStat").innerHTML=`<p class="err">${esc(errMsg(e))}</p>`;tb.querySelectorAll("[data-conf]").forEach(x=>x.disabled=false);ta.disabled=false}
  });
}
function renderEssayResult(n,tb,E){

    ${calib?`<p class="small" style="margin-top:10px">${calib}</p>`:""}

function teachBox(el,terms){
  el.innerHTML=`<div class="card warn" style="margin-top:14px"><p><strong>Claude wasn’t sure about these terms.</strong></p><p class="muted small">Teach it a definition so future questions, grading and answers stay accurate.</p>
    ${terms.map((t,i)=>`<label class="lab" for="tch${i}">${esc(t)}</label><div class="split"><input class="field" id="tch${i}" data-term="${esc(t)}" placeholder="What does it mean?"><button class="btn small" data-tsave="${i}">Save</button></div>`).join("")}</div>`;
  el.querySelectorAll("[data-tsave]").forEach(b=>b.onclick=()=>{

function addGlossary(term,def){
  const i=S.glossary.findIndex(g=>g.term.toLowerCase()===term.toLowerCase());
  if(i>-1)S.glossary[i].def=def;else S.glossary.push({term,def});

/* ----- discuss ----- */
function renderDiscuss(n,body){
  if(!AI){body.innerHTML=`<div class="card" style="margin-top:12px"><p><strong>Discussion needs Claude.</strong></p><p class="muted">Open this page inside Claude and allow it to use Claude when asked.</p></div>`;return}
  const turns=CHATS[n.id]||(CHATS[n.id]=[]);
  const nb=[...neighbors(n.id)].filter(x=>x!==n.id).map(byId);
  const starters=[`Explain ${n.label.en} simply, with an example from the field`,"Ask me a question to check my understanding","What do people often get wrong about this?"];
  if(nb[0])starters.push(`How does it connect to ${nb[0].label.en}?`);
  body.innerHTML=`<div class="chat" id="chat" style="margin-top:12px">${turns.map(t=>`<div class="bubble ${t.role==="user"?"me":"ai"}">${esc(t.content)}</div>`).join("")}</div>
    ${turns.length?"":`<div class="btnrow" style="margin-bottom:10px">${starters.map((s,i)=>`<button class="btn small" data-start="${i}">${esc(s)}</button>`).join("")}</div>`}
    <textarea class="field" rows="3" id="chatIn" placeholder="Ask anything about ${esc(T(n.label))}, in English or Indonesian" aria-label="Message"></textarea>
    <div class="btnrow"><button class="btn primary small" id="chatSend">Send</button>${turns.length?`<button class="btn small" id="chatClear">Clear chat</button>`:""}</div><div id="chatStat"></div><div id="teach"></div>`;
  const send=async text=>{
    text=text.trim();if(!text)return;
    turns.push({role:"user",content:text});renderPanel();
    const chat=$("#chat"),bubble=document.createElement("div");bubble.className="bubble ai";bubble.textContent="Thinking…";chat.appendChild(bubble);
    $("#chatSend").disabled=true;
    const ctl=busy($("#chatStat"),"Claude is answering…");
    const sys=`${RULES}\n\n${conceptContext(n)}\n\nYou are discussing this concept with the learner. Keep answers under 160 words, use one concrete example (construction, workshops, mining or marketing fit this learner well), and end with one short question that checks their understanding. When you introduce a key term, give it in English and Indonesian once, like “reach (jangkauan)”. ${langLine()} If the learner uses a term you don’t know and it isn’t in the glossary, ask them to define it instead of guessing.`;
    try{
      const {text:ans}=await AI([{role:"user",content:sys},{role:"assistant",content:"Understood. I’ll stay grounded in the concept information and the learner’s definitions."},...turns],{cache:false,signal:ctl.signal,modelTier:tier()==="complex"?"default":tier(),onText:({text})=>{bubble.textContent=text}});
      turns.push({role:"assistant",content:ans});renderPanel();
    }catch(e){bubble.textContent=e.text||"";turns.pop();$("#chatStat").innerHTML=`<p class="err">${esc(errMsg(e))}</p>`;$("#chatSend").disabled=false}
  };
  body.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>send(starters[+b.dataset.start]));
  $("#chatSend").onclick=()=>send($("#chatIn").value);
  $("#chatIn").onkeydown=e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey))send($("#chatIn").value)};
  const cl=$("#chatClear");if(cl)cl.onclick=()=>{CHATS[n.id]=[];renderPanel()};
  const chat=$("#chat");chat.lastElementChild&&chat.lastElementChild.scrollIntoView({block:"nearest"});
}

/* ----- path ----- */
function chainBack(id,seen=new Set([id])){
  const out=[];
  S.links.filter(l=>l.status==="approved"&&tid(l)===id&&(l.type==="prerequisite"||l.type==="part_of")).forEach(l=>{const s=sid(l);if(seen.has(s))return;seen.add(s);out.push(...chainBack(s,seen),{id:s,type:l.type})});
  return out;
}
function chainFwd(id,seen=new Set([id])){
  const out=[];
  S.links.filter(l=>l.status==="approved"&&sid(l)===id&&(l.type==="causes"||l.type==="prerequisite")).forEach(l=>{const t=tid(l);if(seen.has(t))return;seen.add(t);out.push({id:t,type:l.type},...chainFwd(t,seen))});
  return out;
}
function renderPath(n,body){
  const back=chainBack(n.id),fwd=chainFwd(n.id);
  const item=(x,here)=>{const m=byId(x.id);return `<li class="${here?"here":""}">${here?`<span>${esc(T(m.label))}</span>`:nodeBtn(m.id)}<span class="sub">${here?"You are here":LEVEL_NAME[level(m.mastery)]+(m.miscon?", misconception":"")}</span></li>`};
  body.innerHTML=`<h3>Order to learn it in</h3>${!back.length&&!fwd.length?`<p class="muted">No prerequisite or cause-and-effect links for this concept yet. They appear as you add sources and approve links.</p>`:`<p class="muted">Study from the top. Steps above build up to this concept; steps below are what it unlocks or leads to.</p>`}
    <ol class="path">${back.map(x=>item(x)).join("")}${item({id:n.id},true)}${fwd.map(x=>item(x)).join("")}</ol>`;
}

/* ----- home ----- */
function renderHome(){
  const c={solid:0,shaky:0,unseen:0};S.nodes.forEach(n=>c[level(n.mastery)]++);
  const d=due(),hist=S.nodes.flatMap(n=>n.hist);
  const sure=hist.filter(h=>h.k==="sure"),guess=hist.filter(h=>h.k==="guess");
  const pct=a=>a.length?Math.round(a.filter(h=>h.c).length/a.length*100):null;
  const ps=pct(sure),pg=pct(guess);
  const overlaps=[];
  S.topics.forEach((a,i)=>S.topics.slice(i+1).forEach(b=>{const shared=S.nodes.filter(n=>n.topics.includes(a.key)&&n.topics.includes(b.key));if(shared.length)overlaps.push({a,b,shared})}));
  const cross=S.links.filter(l=>l.status==="approved"&&!byId(sid(l)).topics.some(k=>byId(tid(l)).topics.includes(k)));
  const pending=S.links.filter(l=>l.status==="suggested").length;
  const syncText={account:"Saved to your Claude account, private to you.",device:"Saved in this browser.",error:"Couldn’t reach your account storage, so changes are saved in this browser for now.",toolarge:"Your map is too large to sync, so it’s saved in this browser."}[SYNC];

    ${hist.length?`<p class="small" style="margin:0 0 4px">${ps!=null?`When you’re certain, you’re right <strong>${ps}%</strong> of the time (${sure.length} answers).`:"You haven’t answered with “Certain” yet."}</p><p class="muted small" style="margin:0">${pg!=null?`When you guess, you’re right ${pg}% of the time.`:""} ${ps!=null&&ps<80?"Being certain and wrong is the most important thing to catch, so those concepts come first in review.":""}</p>`:`<p class="muted">Each answer asks how sure you are. Over time this shows whether you really know a concept or are guessing.</p>`}
    <h3>Due for review (${d.length})</h3>
    <ul class="plain">${d.slice(0,6).map(n=>`<li class="row-item split"><span>${nodeBtn(n.id)}${n.miscon?`<span class="pill bad">Misconception</span>`:""}</span><span class="muted small">${n.mastery}%</span></li>`).join("")||`<li class="muted">Nothing due.</li>`}</ul>
    <h3>Where domains overlap (${overlaps.length})</h3>
    ${overlaps.length?`<ul class="plain">${overlaps.map(o=>`<li class="row-item"><span class="dot" style="background:var(--c${o.a.c%8})"></span> ${esc(T(o.a))} ∩ <span class="dot" style="background:var(--c${o.b.c%8})"></span> ${esc(T(o.b))}: ${o.shared.map(n=>nodeBtn(n.id)).join(", ")}</li>`).join("")}</ul>`:`<p class="muted">No concept belongs to two domains yet.</p>`}
    <h3>Links across domains (${cross.length})</h3>
    <ul class="plain">${cross.map(l=>`<li class="row-item">${sentence(l)}</li>`).join("")}</ul>
    ${pending?`<p class="muted small">${pending} suggested link${pending>1?"s":""} waiting for review. They show as blue dashed lines.</p>`:""}
    <h3>Your glossary (${S.glossary.length})</h3>
    ${S.glossary.length?`<ul class="plain">${S.glossary.map((g,i)=>`<li class="row-item"><b style="font-weight:500">${esc(g.term)}</b><span class="alt">${esc(g.def)}</span><button class="link small" data-gdel="${i}">Remove</button></li>`).join("")}</ul>`:`<p class="muted">Terms you teach Claude appear here. Claude treats them as the source of truth.</p>`}
    <div class="split" style="margin-top:10px"><input class="field" id="gTerm" placeholder="Term" aria-label="Term" style="max-width:38%"><input class="field" id="gDef" placeholder="Definition" aria-label="Definition"></div>
    <div class="btnrow"><button class="btn small" id="gAdd">Teach this term</button></div>
    <h3>About this map</h3>
    <p class="muted small">${syncText} ${AI?"Claude is available for AI questions, essays, discussion and adding sources.":"Claude isn’t available in this view, so AI features are hidden."}</p>
    <button class="link small" id="reset">Reset to the demo map</button>`;
  wireGo(panel);
  panel.querySelectorAll("[data-gdel]").forEach(b=>b.onclick=()=>{S.glossary.splice(+b.dataset.gdel,1);save();renderPanel()});
  $("#gAdd").onclick=()=>{const t=$("#gTerm").value.trim(),d=$("#gDef").value.trim();if(!t||!d){toast("Enter a term and its definition");return}addGlossary(t,d);renderPanel()};
  $("#reset").onclick=e=>{const b=e.currentTarget;if(!b.dataset.armed){b.dataset.armed="1";b.textContent="Click again to replace your map, scores and glossary with the demo";return}S=defaultState();save();selected=null;buildChips();syncControls();render();renderPanel();sim.alpha(1).restart()};
  const ab=$("#approveAll");if(ab)ab.onclick=()=>{S.links.forEach(l=>{if(l.status==="suggested"&&(S.lastImport.links||[]).includes(sid(l)+">"+tid(l)))l.status="approved"});save();render();renderPanel();toast("Links approved")};
  const cl=$("#closeImport");if(cl)cl.onclick=()=>{S.lastImport=null;save();renderPanel()};
  if(S.lastImport&&S.lastImport.unknown&&S.lastImport.unknown.length)teachBox($("#impTeach"),S.lastImport.unknown);
}
function importReport(){
  const r=S.lastImport,pend=(r.links||[]).filter(k=>S.links.some(l=>l.status==="suggested"&&sid(l)+">"+tid(l)===k)).length;
  return `<div class="card dashed"><p><strong>Added from “${esc(r.title)}”</strong></p>
    ${r.added.length?`<p class="small">New concepts: ${r.added.filter(byId).map(nodeBtn).join(", ")}</p>`:""}
    ${r.merged.length?`<p class="small">Merged into existing: ${r.merged.filter(byId).map(nodeBtn).join(", ")}</p>`:""}
    ${r.domains&&r.domains.length?`<p class="small">New domains: ${r.domains.map(k=>esc(T(topic(k)))).join(", ")}</p>`:""}
    <p class="small">${pend} suggested link${pend===1?"":"s"} waiting for review.</p>
    <div class="btnrow">${pend?`<button class="btn primary small" id="approveAll">Approve all links</button>`:""}<button class="btn small" id="closeImport">Dismiss</button></div>
    <div id="impTeach"></div></div>`;
}

/* ================= add source ================= */
const dlg=$("#addDlg");
$("#addBtn").onclick=()=>{$("#srcErr").classList.add("hidden");$("#srcGo").disabled=!AI;$("#srcOffline").classList.toggle("hidden",!!S.demo);
  if(!AI){$("#srcErr").textContent="Claude isn’t available in this view, so concepts can’t be extracted from your text. You can still add the offline demo.";$("#srcErr").classList.remove("hidden")}
  dlg.showModal()};
$("#srcCancel").onclick=()=>dlg.close();
$("#srcSample").onclick=()=>{$("#srcTitle").value=SAMPLE_TITLE;$("#srcText").value=SAMPLE_TEXT};
$("#srcOffline").onclick=()=>{applyOffline();dlg.close()};
let srcCtl=null;
$("#srcStop").onclick=()=>srcCtl&&srcCtl.abort();
$("#srcGo").onclick=async()=>{
  const title=$("#srcTitle").value.trim()||"Untitled source",text=$("#srcText").value.trim(),err=$("#srcErr");
  err.classList.add("hidden");
  if(text.split(/\s+/).length<25){err.textContent="Paste at least a paragraph so there’s something to learn from.";err.classList.remove("hidden");return}
  srcCtl=new AbortController();$("#srcStatus").classList.remove("hidden");$("#srcStatusText").textContent="Reading and finding concepts. This can take a minute…";$("#srcGo").disabled=true;
  try{
    const r=await AI.json(`You build a bilingual (English and Indonesian) concept map for a learner.
EXISTING DOMAINS (key: English / Indonesian):
${S.topics.map(t=>`- ${t.key}: ${t.en} / ${t.id}`).join("\n")}
EXISTING CONCEPTS (id: English label, domains):
${S.nodes.map(n=>`- ${n.id}: ${n.label.en} [${n.topics.join(",")}]`).join("\n")}
VERIFIED GLOSSARY (authoritative, follow over your own knowledge):
${glossaryText()}
SOURCE TITLE: ${title}
SOURCE TEXT:
"""${text.slice(0,24000)}"""

Task:
1. Extract the 3 to 7 most important concepts in the source.
2. If a concept is the same idea as an existing concept, set existing_id to that id instead of creating a duplicate.
3. Give each concept 1 or 2 domains. Reuse existing domain keys when they fit; otherwise add a new domain (short lowercase key, English and Indonesian names).
4. Write summaries only from the source text and the glossary. Don’t add facts the source doesn’t support.
5. Add 2 vocabulary pairs per concept: the English term, the Indonesian equivalent professionals actually use, and a short Indonesian example sentence.
6. Propose links between concepts (new or existing) with type prerequisite, part_of, causes, contrasts, example_of or related, each with a one-sentence reason grounded in the source. Prefer links that connect different domains when the source supports them.
7. List any terms in the source you aren’t confident you understand in unknown_terms.
Reply with only JSON:
{"new_domains":[{"key":"","en":"","id":""}],"concepts":[{"key":"","existing_id":null,"label_en":"","label_id":"","summary_en":"","summary_id":"","domains":[""],"source_note":"","vocab":[{"en":"","id":"","ex":""}]}],"links":[{"from":"","to":"","type":"","why_en":""}],"unknown_terms":[""]}`,{modelTier:tier(),signal:srcCtl.signal});
    applyImport(title,r);dlg.close();$("#srcText").value="";$("#srcTitle").value="";
  }catch(e){err.textContent=errMsg(e);err.classList.remove("hidden")}
  $("#srcStatus").classList.add("hidden");$("#srcGo").disabled=false;srcCtl=null;
};
function applyImport(title,r){
  if(!r||!Array.isArray(r.concepts))throw {code:"invalid_json"};
  const report={title,added:[],merged:[],domains:[],links:[],unknown:(r.unknown_terms||[]).map(String).filter(Boolean).slice(0,6)};
  (r.new_domains||[]).forEach(d=>{
    if(!d||!d.en)return;let key=slug(d.key||d.en);if(topic(key))return;
    S.topics.push({key,en:String(d.en),id:String(d.id||d.en),c:S.topics.length});report.domains.push(key);
  });
  const keyMap={};
  r.concepts.forEach(c=>{
    if(!c||!c.label_en)return;
    const doms=(c.domains||[]).map(k=>topic(k)?k:topic(slug(k))?slug(k):null).filter(Boolean);
    const src={t:title,n:String(c.source_note||"Mentioned in this source.")};
    const vocab=(c.vocab||[]).filter(v=>v&&v.en&&v.id).map(v=>({en:String(v.en),id:String(v.id),ex:String(v.ex||"")}));
    let ex=c.existing_id&&byId(c.existing_id);
    if(!ex)ex=S.nodes.find(n=>n.label.en.toLowerCase()===String(c.label_en).toLowerCase());
    if(ex){
      if(!ex.sources.some(s=>s.t===title))ex.sources.push(src);
      doms.forEach(k=>{if(!ex.topics.includes(k)&&ex.topics.length<3)ex.topics.push(k)});
      vocab.forEach(v=>{if(!ex.vocab.some(x=>x.en.toLowerCase()===v.en.toLowerCase()))ex.vocab.push(v)});
      keyMap[c.key||c.label_en]=ex.id;if(c.existing_id)keyMap[c.existing_id]=ex.id;report.merged.push(ex.id);
    }else{
      const id=uniqueId(slug(c.label_en));
      const topics=doms.length?doms:[report.domains[0]||S.topics[0].key];
      const n={id,label:B(String(c.label_en),String(c.label_id||c.label_en)),topics,mastery:0,summary:B(String(c.summary_en||""),String(c.summary_id||c.summary_en||"")),sources:[src],vocab,quiz:[],hist:[],miscon:false,auto:true,origin:title};
      AN=anchors();n.x=ax(n)+(Math.random()*60-30);n.y=ay(n)+(Math.random()*60-30);
      S.nodes.push(n);keyMap[c.key||c.label_en]=id;report.added.push(id);
    }
  });
  const resolve=k=>keyMap[k]||(byId(k)?k:null);
  (r.links||[]).forEach(l=>{
    if(!l)return;const s=resolve(l.from),t=resolve(l.to);
    if(!s||!t||s===t||!TYPES[l.type])return;
    if(S.links.some(x=>(sid(x)===s&&tid(x)===t)||(sid(x)===t&&tid(x)===s)))return;
    S.links.push({source:s,target:t,type:l.type,status:"suggested",why:{en:String(l.why_en||"")}});report.links.push(s+">"+t);
  });
  S.lastImport=report;
  save();buildChips();render();sim.alpha(.8).restart();selected=null;renderPanel();
  toast(`Added ${report.added.length} new concept${report.added.length===1?"":"s"}, merged ${report.merged.length}`);
}
function applyOffline(){
  if(S.demo){toast("The offline demo is already in your map");return}
  S.demo=true;
  const report={title:SAMPLE_TITLE,added:[],merged:[],domains:[],links:[],unknown:[]};
  OFFLINE.nodes.forEach(n=>{if(byId(n.id))return;const c={...clone(n),hist:[],miscon:false};AN=anchors();c.x=ax(c)+(Math.random()*40-20);c.y=ay(c)+(Math.random()*40-20);S.nodes.push(c);report.added.push(c.id)});
  const m=byId(OFFLINE.merge.id);if(m&&!m.sources.some(s=>s.t===SAMPLE_TITLE)){m.sources.push(OFFLINE.merge.source);report.merged.push(m.id)}
  OFFLINE.links.forEach(l=>{if(!S.links.some(x=>sid(x)===l.source&&tid(x)===l.target)){S.links.push(clone(l));report.links.push(l.source+">"+l.target)}});
  S.lastImport=report;save();render();sim.alpha(.8).restart();selected=null;renderPanel();toast("Offline demo source added");
}

$("#reviewBtn").onclick=()=>{const d=due();if(d.length){testMode="mcq";select(d[0].id,"test")}else toast("Nothing due. Every concept is solid.")};

/* ================= start ================= */
syncControls();buildChips();buildLegend();render();renderPanel();
initCloud();
</script>
</body>
